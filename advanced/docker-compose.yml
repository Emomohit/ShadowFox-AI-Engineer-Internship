version: '3.8'

services:
  backend:
    build:
      context: ..
      dockerfile: advanced/Dockerfile
    container_name: knowledgeforge_backend
    ports:
      - "8000:8000"
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-gemini-1.5-flash}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-models/text-embedding-004}
      - APP_ENV=production
    volumes:
      - kf_storage:/app/advanced/backend/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 20s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: advanced/Dockerfile
    container_name: knowledgeforge_frontend
    command: ["streamlit", "run", "advanced/frontend/app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  kf_storage:
